.arrow{flex:0 0 auto;align-self:center;width:28px;height:2px;background:var(--line);position:relative;margin:0 2px}
.arrow::after{content:"";position:absolute;right:-1px;top:-5px;border:6px solid transparent;border-left:8px solid var(--line);border-right:0}

.scene{flex:1;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;align-items:start}

.text h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9em,3.3vw,3em);line-height:1.05;margin:.1em 0 .35em;text-wrap:balance;letter-spacing:-.01em}

.text ul{margin:.2em 0 .8em;padding-left:1.1em} .text li{margin:.25em 0}
code{font-family:var(--mono);font-size:.92em;background:var(--accent-soft);padding:.05em .3em;border-radius:4px}
kbd{font-family:var(--mono);font-size:.85em;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:5px;padding:.02em .4em;background:var(--panel)}

.term .bar i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18);display:inline-block}

.term .p{color:var(--term-prompt)} .term .d{color:var(--term-dim)} .term .h{color:var(--term-hi);font-weight:600}
.term .ln{display:block;transition:opacity .35s} .term .ln.hidden{opacity:0}
.term .wrap{display:block;white-space:pre-wrap;overflow-wrap:anywhere;border-left:3px solid var(--term-hi);padding-left:.6em;margin:.2em 0}
.term .note{display:block;color:var(--term-dim);font-style:italic}
.term .nanobar{display:block;background:#DCE3EA;color:#18212B;padding:0 .3em}
.vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:.6em 0}

.rules .no{background:var(--danger-soft);border:1.5px solid var(--danger)}
.rules h3{margin:0 0 .4em;font-family:var(--display)}
.rules ul{margin:0;padding-left:1.1em}

.fields{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,2.2fr);gap:8px;margin:.5em 0 .9em}

/* tabla de pruebas */
table.tests{border-collapse:collapse;width:100%;font-size:.82em;margin:.3em 0 .8em;background:var(--panel)}
table.tests th,table.tests td{border:1px solid var(--line);padding:.35em .55em;text-align:left;vertical-align:top}
table.tests th{font-family:var(--mono);font-size:.8em;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500}
table.tests td.ok{color:var(--ok);font-weight:600} table.tests td.ko{color:var(--danger);font-weight:600}

nav.ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;padding:0;cursor:pointer}

.btns{display:flex;gap:8px}
.btns button{font:inherit;font-size:.85em;font-weight:600;padding:.45em 1em;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--panel);cursor:pointer}
.btns button.sec{background:transparent;color:var(--accent)}
.btns button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--mine);outline-offset:2px}
.hint{font-size:.7em;color:var(--muted)}
.cover-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;padding:2vh 0}
.cmds{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:.55em .9em}

.cmds dl{margin:0;display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:.3em 1em;font-size:.82em}
.cmds dt{font-family:var(--mono);font-weight:600;color:var(--accent);white-space:nowrap}
.cmds dd{margin:0;min-width:0}
.cmds dd code{font-size:.9em}
@media (max-width:820px){.cmds dl{grid-template-columns:1fr}.cmds dt{white-space:normal}.cmds dd{margin-bottom:.4em}}
@media (max-width:820px){.scene,.cover-wrap{grid-template-columns:1fr}.vs,.rules{grid-template-columns:1fr}.node{min-width:84px}.fields{grid-template-columns:repeat(5,minmax(0,1fr))}.fields .cmd{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const P = s => `<span class="p">alopez@servidor:~/aso-lab$</span> ${s}`;
const PH = s => `<span class="p">alopez@servidor:~$</span> ${s}`;
const PS = s => `<span class="p">PS /home/alopez/aso-lab&gt;</span> ${s}`;
const DF = `Filesystem                         Size  Used Avail Use% Mounted on
tmpfs                              781M  1.6M  780M   1% /run
/dev/mapper/ubuntu--vg-ubuntu--lv   98G   12G   82G  13% /
tmpfs                              3.9G     0  3.9G   0% /dev/shm
/dev/sda2                          2.0G  185M  1.7G  10% /boot`;
const LINEA = '27 9 * * * /usr/bin/bash /home/alopez/aso-lab/informe.sh /home/alopez/aso-lab/cron.txt &gt;&gt; /home/alopez/aso-lab/cron.log 2&gt;&amp;1';
const scenes = [
  { map:[], arrows:[], cover:true, html:`
    <div class="cover-wrap">
      <div class="text">
        <span class="kicker">Antes de empezar la práctica</span>
        <h1>De una orden a un guion</h1>
        <p>Un <strong>script</strong> es un archivo con órdenes que Bash ejecuta una detrás de otra. Lo escribes una vez y lo repites las veces que quieras.</p>
        <p>Hoy hacemos el recorrido completo: <strong>escribirlo, guardarlo, ejecutarlo, probarlo y programarlo</strong> para que se ejecute solo a una hora.</p>
        <div class="callout stop"><strong>Norma de la unidad:</strong> todo con tu cuenta de ASO, dentro de <code>~/aso-lab</code> y sin <code>sudo</code>.</div>
      </div>
      <div class="term"><div class="bar"><i></i><i></i><i></i>&nbsp; ssh alopez@10.113.136.251</div><pre>${P('bash informe.sh')}
Informe guardado en informe.txt
${P('head -3 informe.txt')}
Thu Nov 12 09:14:03 CET 2026
servidor
Filesystem                         Size  Used Avail Use% Mounted on</pre></div>
    </div>`},
  { map:['nano','guion'], arrows:[1], steps:4, html:`
    <div class="text">
      <h2>Guardar un script</h2>
      <ul>
        <li data-s="1">Crea tu espacio de prácticas y entra en él. <code>-p</code> evita el error si ya existe.</li>
        <li data-s="2"><code>nano informe.sh</code> abre el editor. Si el archivo no existe, se crea al guardar.</li>
        <li data-s="3">Pega el script. La primera línea es <code>#!/usr/bin/env bash</code>. Guarda con <kbd>Ctrl</kbd>+<kbd>O</kbd>, confirma el nombre con <kbd>Intro</kbd> y sal con <kbd>Ctrl</kbd>+<kbd>X</kbd>.</li>
        <li data-s="4">Comprueba que está: <code>ls -l</code> enseña el archivo y su tamaño; <code>cat</code>, su contenido.</li>
      </ul>
      <div class="callout" data-s="4">No hace falta <code>chmod +x</code>: lo ejecutaremos escribiendo <code>bash informe.sh</code>.</div>
    </div>
    <div class="term"><div class="bar"><i></i><i></i><i></i>&nbsp; del teclado al archivo</div><pre><span class="ln" data-s="1">${PH('mkdir -p ~/aso-lab')}
${PH('cd ~/aso-lab')}
</span><span class="ln" data-s="2">${P('nano informe.sh')}
</span><span class="ln" data-s="3"><span class="nanobar">  GNU nano 7.2              informe.sh                Modified  </span>#!/usr/bin/env bash
destino="\${1:-informe.txt}"
<span class="d">…</span>
<span class="nanobar">File Name to Write: informe.sh                                  </span><span class="h">^O</span> Write Out   <span class="h">^X</span> Exit
</span><span class="ln" data-s="4">${P('ls -l informe.sh')}
-rw-rw-r-- 1 alopez alopez 211 Nov 12 09:05 <span class="h">informe.sh</span>
${P('cat informe.sh')}
#!/usr/bin/env bash
<span class="d">… el script completo</span></span></pre></div>`},
  { map:['guion'], arrows:[], steps:5, html:`
    <div class="text">
      <h2>Leer el script antes de ejecutarlo</h2>
      <ul>
        <li data-s="1"><code>#!/usr/bin/env bash</code>: dice qué intérprete lo ejecuta.</li>
        <li data-s="2"><code>destino="\${1:-informe.txt}"</code>: <code>$1</code> es el <strong>primer argumento</strong>. Si no escribes ninguno, usa <code>informe.txt</code>.</li>
        <li data-s="3">Las llaves agrupan <code>date</code>, <code>hostname</code> y <code>df -h</code>. El <code>&gt;</code> manda toda su salida al archivo y lo <strong>reemplaza</strong> si ya existía.</li>
        <li data-s="4"><code>if … then</code>: si se pudo escribir el archivo, avisa de que está guardado.</li>
        <li data-s="5"><code>else</code>: si no, escribe un error (<code>&gt;&amp;2</code>, la salida de errores) y termina con <code>exit 1</code>.</li>
      </ul>
    </div>
    <div class="term"><div class="bar"><i></i><i></i><i></i>&nbsp; informe.sh</div><pre><span class="d"> 1</span>  <span class="h">#!/usr/bin/env bash</span>
<span class="d"> 2</span>  destino="<span class="h">\${1:-informe.txt}</span>"
<span class="d"> 3</span>  <span class="h">if</span> {
<span class="d"> 4</span>    date
<span class="d"> 5</span>    hostname
<span class="d"> 6</span>    df -h
<span class="d"> 7</span>  } <span class="h">&gt; "$destino"</span>; <span class="h">then</span>
<span class="d"> 8</span>    printf 'Informe guardado en %s\\n' "$destino"
<span class="d"> 9</span>  <span class="h">else</span>
<span class="d">10</span>    printf 'No se pudo generar el informe\\n' <span class="h">&gt;&amp;2</span>
<span class="d">11</span>    <span class="h">exit 1</span>
<span class="d">12</span>  fi</pre></div>`},
  { map:['guion','bash','informe'], arrows:[2,3], steps:3, html:`
    <div class="text">
      <h2>Ejecutarlo con un destino propio</h2>
      <p>Lo que escribes detrás del nombre del script es el <strong>argumento</strong>: dentro del script se llama <code>$1</code>.</p>
      <ul>
        <li data-s="1">Sin argumento: guarda en <code>informe.txt</code>.</li>
        <li data-s="2">Con argumento: guarda donde tú digas.</li>
        <li data-s="3"><code>echo $?</code> enseña cómo terminó la última orden: <strong>0</strong> es que fue bien.</li>
      </ul>
    </div>
    <div class="term"><div class="bar"><i></i><i></i><i></i>&nbsp; ejecutar</div><pre><span class="ln" data-s="1">${P('bash informe.sh')}
Informe guardado en informe.txt
</span><span class="ln" data-s="2">${P('bash informe.sh <span class="h">lunes.txt</span>')}
Informe guardado en lunes.txt
${P('cat lunes.txt')}
Thu Nov 12 09:16:40 CET 2026
servidor
${DF}
</span><span class="ln" data-s="3">${P('echo $?')}
<span class="h">0</span></span></pre></div>`},
  { map:['guion','bash','informe'], arrows:[2,3], steps:3, html:`
    <div class="text">
      <h2>Probarlo: tres casos</h2>
      <table class="tests">
        <tr><th>Caso</th><th>Espero</th><th>Ocurre</th></tr>
        <tr data-s="1"><td>Normal</td><td>Se guarda</td><td class="ok">Guardado · 0</td></tr>
        <tr data-s="2"><td>Ruta con espacios</td><td>Un solo archivo</td><td class="ok">Guardado · 0</td></tr>
        <tr data-s="3"><td>Sin permiso de escritura</td><td>Error y código 1</td><td class="ko">Permission denied · 1</td></tr>
      </table>
      <p data-s="2">Con espacios, el nombre va <strong>entre comillas</strong> al ejecutar. Dentro del script, <code>"$destino"</code> también va entre comillas para no partirlo.</p>
      <div class="callout" data-s="3">El directorio personal de un compañero no deja escribir: es justo el error que queremos ver. Esa tabla, con lo que esperabais y lo que pasó, va a la entrega.</div>
    </div>
    <div class="term"><div class="bar"><i></i><i></i><i></i>&nbsp; casos de prueba</div><pre><span class="ln" data-s="1">${P('bash informe.sh lunes.txt; echo $?')}
Informe guardado en lunes.txt
0
</span><span class="ln" data-s="2">${P('bash informe.sh <span class="h">"informe del lunes.txt"</span>; echo $?')}
Informe guardado en informe del lunes.txt
0
${P('ls')}
informe.sh  informe.txt  <span class="h">'informe del lunes.txt'</span>  lunes.txt
</span><span class="ln" data-s="3">${P('bash informe.sh /home/bmartin/informe.txt; echo $?')}
informe.sh: line 12: /home/bmartin/informe.txt: <span class="h">Permission denied</span>
No se pudo generar el informe
<span class="h">1</span></span></pre></div>`},
  { map:['cron'], arrows:[], steps:2, html:`
    <div class="text">
      <h2>Una tarea programada: cuándo y qué</h2>
      <p><code>cron</code> es el servicio que lanza tareas a su hora. Cada cuenta tiene su propia tabla de tareas, la <strong>crontab</strong>. Cada línea dice <strong>cuándo</strong> y <strong>qué</strong>:</p>
      <div class="fields">
        <div><b>30</b><span>minuto</span></div>
        <div><b>8</b><span>hora</span></div>
        <div><b>*</b><span>día del mes</span></div>
        <div><b>*</b><span>mes</span></div>
        <div><b>1</b><span>día de la semana · 1 = lunes</span></div>
        <div class="cmd"><b>/ruta/absoluta/orden</b><span>qué ejecuta</span></div>
      </div>
      <p><code>*</code> significa «todos». Esta línea: <strong>los lunes a las 08:30</strong>, con la hora del servidor.</p>
      <div class="callout stop" data-s="2">cron no abre tu sesión ni entra en <code>~/aso-lab</code>: las rutas van <strong>completas</strong>, desde <code>/</code>.</div>

let si = 0, sub = 0;
const stage = document.getElementById('stage'), dots = document.getElementById('dots');
scenes.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Pantalla '+(i+1));b.addEventListener('click',()=>go(i,999));dots.appendChild(b)});
function render(){
  const s = scenes[si], steps = s.steps||0;
  if(stage.dataset.si!==String(si)){stage.innerHTML=s.html;stage.dataset.si=si;stage.className='scene'+(s.cover?' cover':'')}
  stage.querySelectorAll('[data-s]').forEach(el=>{const n=+el.dataset.s;const show=!steps||n<=sub;if(el.classList.contains('ln'))el.classList.toggle('hidden',!show);else el.hidden=!show});
  document.querySelectorAll('.node').forEach(n=>n.classList.toggle('on',s.map.includes(n.dataset.n)));
  document.querySelectorAll('.arrow').forEach(a=>a.classList.toggle('on',s.arrows.includes(+a.dataset.a)));
  [...dots.children].forEach((d,i)=>{if(i===si)d.setAttribute('aria-current','step');else d.removeAttribute('aria-current')});
  const list = CMDS[si]||[];
  document.getElementById('cmds').hidden = !list.length;
  document.getElementById('cmdlist').innerHTML = list.map(([c,t])=>`<dt>${c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</dt><dd>${t}</dd>`).join('');
  document.getElementById('count').textContent=(si+1)+' / '+scenes.length;
  document.getElementById('prev').disabled = si===0 && sub===0;
  document.getElementById('next').disabled = si===scenes.length-1;
}
function go(i,subStart){si=Math.max(0,Math.min(scenes.length-1,i));const st=scenes[si].steps||0;sub=Math.min(subStart,st);render()}
function next(){const st=scenes[si].steps||0;if(sub<st){sub++;render()}else if(si<scenes.length-1){go(si+1,0);if((scenes[si].steps||0)>0){sub=1;render()}}}
function prev(){if(sub>1){sub--;render()}else if(si>0){go(si-1,999)}else{sub=0;render()}}
document.getElementById('next').addEventListener('click',next);
document.getElementById('prev').addEventListener('click',prev);
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}});
go(0,0);
