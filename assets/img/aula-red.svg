    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#57687d"/></marker>
    <marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#b64517"/></marker>
  </defs>
  <rect width="760" height="500" fill="#fff"/>

  <rect x="200" y="20" width="360" height="62" rx="8" fill="#f3f6fb" stroke="#57687d"/>
  <text x="380" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#172a42">Equipos del alumnado</text>
  <text x="380" y="68" text-anchor="middle" font-size="14" fill="#245cc7" font-family="Consolas, monospace">ssh usuario@10.113.129.x</text>
  <line x1="380" y1="82" x2="380" y2="110" stroke="#57687d" stroke-width="1.5" marker-end="url(#a)"/>

