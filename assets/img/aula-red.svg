<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Red del aula de ASO</title>
  <desc id="d">Los equipos del alumnado están en la red del aula 10.113.129.0. Cuatro routers MikroTik, uno por grupo, tienen una dirección en esa red y una red interna propia: 192.168.101.0 para G1, 192.168.102.0 para G2, 192.168.103.0 para G3 y 192.168.104.0 para G4. El servidor Ubuntu de cada grupo tiene la dirección .2 de su red interna. Cada router redirige el puerto 22 a su servidor, de modo que el alumnado se conecta por SSH a la IP del router.</desc>
