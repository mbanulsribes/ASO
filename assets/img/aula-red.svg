      <text x="110" y="268" fill="#b64517" font-weight="700">22 → 192.168.101.2:22</text>
      <line x1="110" y1="280" x2="110" y2="330" stroke="#b64517" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#s)"/>
