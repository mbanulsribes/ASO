name: Publicar web ASO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Generar desde AsciiDoc
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Preparar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.19.0'
          run_install: false
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Generar la web desde los archivos adoc
        run: pnpm build
      - name: Comprobar enlaces y Planes B
        run: pnpm check
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir la web generada
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar en Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
